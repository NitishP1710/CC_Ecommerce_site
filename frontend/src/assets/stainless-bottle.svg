<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stainless steel water bottle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#e4ebf2"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8e98a2"/>
      <stop offset="25%" stop-color="#d8dde3"/>
      <stop offset="50%" stop-color="#9fa8b1"/>
      <stop offset="75%" stop-color="#f1f4f7"/>
      <stop offset="100%" stop-color="#7f8a96"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e3c4c"/>
      <stop offset="100%" stop-color="#1a2430"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="520" rx="150" ry="22" fill="#c7d0d9" opacity="0.45"/>

  <rect x="355" y="130" width="90" height="40" rx="12" fill="url(#cap)"/>
  <rect x="340" y="165" width="120" height="24" rx="10" fill="#2c3b4a"/>

  <rect x="285" y="185" width="230" height="300" rx="90" fill="url(#metal)" stroke="#707b87" stroke-width="2"/>
  <rect x="360" y="205" width="18" height="250" rx="9" fill="#ffffff" opacity="0.28"/>
  <rect x="420" y="210" width="8" height="230" rx="4" fill="#d0d7de" opacity="0.55"/>

  <text x="400" y="352" text-anchor="middle" font-size="32" font-family="Segoe UI, Arial, sans-serif" fill="#2f3a46" opacity="0.85">
    750 ml
  </text>
  <text x="400" y="388" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#4f5b67" opacity="0.8">
    Stainless Bottle
